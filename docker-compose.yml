services:

  flask:
    image: ghcr.io/mohammad-sadeghi-official/flask-docker-cicd:${APP_VERSION:-main}
    container_name: flask
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z

    depends_on:
      flask:
        condition: service_healthy

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
